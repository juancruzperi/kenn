<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#04082f">
    <title>Kenn</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- GSAP y ScrollTrigger: zoom del video sincronizado con el scroll. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header class="site-header" data-header>
      <div class="site-header__inner">
        <img class="site-header__logo" src="assets/logo-kenn.svg" alt="Kenn" width="861" height="441" decoding="async">
        <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-controls="navigation" aria-expanded="false">
          <span class="menu-toggle__lines" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
      </div>
    </header>

    <nav class="fullscreen-menu" id="navigation" aria-label="Navegación principal" aria-hidden="true" inert>
      <ul class="fullscreen-menu__links">
        <li><a href="#servicios">SERVICIOS</a></li>
        <li><a href="#contacto">CONTACTO</a></li>
      </ul>
    </nav>

    <main id="contenido">
      <!-- HERO / EL MOMENTO: video panorámico y vertical aún pendientes. -->
      <section class="hero" id="inicio" aria-labelledby="hero-title" data-hero>
        <div class="hero__media">
          <div class="hero__visual" data-hero-visual aria-hidden="true">
            <div class="hero__fallback">
              <span class="hero__fallback-label">VIDEO · EL MOMENTO</span>
            </div>
            <video class="hero__video" autoplay muted loop playsinline preload="none" aria-hidden="true">
              <!-- Cuando tengas los MP4, movelos a assets/videos/ y descomentá:
              <source src="assets/videos/el-momento-mobile.mp4" type="video/mp4" media="(max-width: 1023px) and (orientation: portrait)">
              <source src="assets/videos/el-momento-desktop.mp4" type="video/mp4">
              -->
            </video>
          </div>

          <div class="hero__shade" aria-hidden="true"></div>

          <div class="hero__title-wrap">
            <h1 class="hero__title" id="hero-title">EL MOMENTO</h1>
          </div>
        </div>
      </section>

      <!-- TU MOMENTO: la introducción ocupa el espacio azul debajo del Hero.
           El título avanza sobre el video a medida que este se revela por scroll. -->
      <section class="tu-momento" id="tu-momento" aria-labelledby="tu-momento-title" data-tu-momento>
        <div class="tu-momento__intro">
          <h2 class="tu-momento__title" id="tu-momento-title" data-tu-momento-title>TU MOMENTO</h2>
        </div>

        <div class="tu-momento__media">
          <div class="tu-momento__reveal" data-tu-momento-reveal aria-hidden="true">
            <div class="tu-momento__fallback">
              <span class="tu-momento__placeholder">VIDEO · TU MOMENTO</span>
            </div>
            <video class="tu-momento__video" autoplay muted loop playsinline preload="none">
              <!-- Cuando tengas el material backstage, guardalo en assets/videos/
                   y descomentá las dos fuentes de video:
              <source src="assets/videos/tu-momento-mobile.mp4" type="video/mp4" media="(max-width: 1023px) and (orientation: portrait)">
              <source src="assets/videos/tu-momento-desktop.mp4" type="video/mp4">
              -->
            </video>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
